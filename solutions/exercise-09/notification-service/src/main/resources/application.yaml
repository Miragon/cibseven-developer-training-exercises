# Notification worker — a standalone External Task Client (no HTTP server of its own).
spring:
  main:
    web-application-type: none          # pure worker; no port clash with the engine on 8080

# CIB Seven External Task Client: connect remotely to the engine's REST API and poll our topic.
camunda:
  bpm:
    client:
      base-url: http://localhost:8080/engine-rest
      lock-duration: 20000

# Where to announce new members: a Microsoft Teams channel via a Power Automate "Workflows" webhook
# (template: "When a Teams webhook request is received").
notification:
  teams:
    # Supply the real webhook URL via the TEAMS_WEBHOOK_URL env var — do NOT commit the secret.
    webhook-url: ${TEAMS_WEBHOOK_URL:https://CHANGE-ME}

logging:
  level:
    io.miragon.training: INFO
