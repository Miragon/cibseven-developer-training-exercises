name: Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: ./mvnw clean verify

      # The Aufgabe-9 worker template lives under templates/ and is not part of the default reactor
      # (so services/ stays clean for exercises 0–8). Compile it here so the starter never rots.
      - name: Verify exercise-9 starter template
        run: ./mvnw -Pexercise-9 -pl templates/exercise-09/logistics-service clean compile
